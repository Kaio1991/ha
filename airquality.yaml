blueprint:
  name: CO2 Luftqualität Benachrichtigung (Multi-Sensor)
  description: >
    Überwacht mehrere CO2-Sensoren (ppm) gleichzeitig innerhalb einer einzigen
    Automatisierung und sendet eine Benachrichtigung an 1-x Mobilgeräte, sobald
    der obere Grenzwert überschritten wird. Der Titel der Benachrichtigung
    enthält automatisch den Namen der Messstation, die den Grenzwert
    überschritten hat. Benachrichtigungen werden nur innerhalb eines
    definierten Zeitfensters (z. B. 08:00–21:30 Uhr) zugestellt. Sobald der
    jeweilige Sensor unter den unteren Grenzwert fällt, wird nur die zu diesem
    Sensor gehörende Benachrichtigung wieder entfernt.
  domain: automation
  input:
    co2_sensors:
      name: CO2-Sensoren
      description: Alle Sensor-Entitäten (Messstationen), die überwacht werden sollen.
      selector:
        entity:
          domain: sensor
          multiple: true

    notify_devices:
      name: Zielgeräte
      description: >
        Ein oder mehrere Geräte (Home Assistant Companion App), an die die
        Benachrichtigungen gesendet werden sollen. Gilt für alle Sensoren oben.
      selector:
        device:
          integration: mobile_app
          multiple: true

    threshold_high:
      name: Oberer Grenzwert (ppm)
      description: Ab diesem Wert wird die Benachrichtigung ausgelöst.
      default: 1500
      selector:
        number:
          min: 400
          max: 5000
          unit_of_measurement: ppm
          mode: box

    threshold_low:
      name: Unterer Grenzwert (ppm)
      description: Ab diesem Wert wird die Benachrichtigung wieder entfernt.
      default: 1000
      selector:
        number:
          min: 400
          max: 5000
          unit_of_measurement: ppm
          mode: box

    time_start:
      name: Beginn Benachrichtigungszeitraum
      default: "08:00:00"
      selector:
        time: {}

    time_end:
      name: Ende Benachrichtigungszeitraum
      default: "21:30:00"
      selector:
        time: {}

    notification_title:
      name: Titel der Benachrichtigung
      description: >
        {{ trigger.to_state.name }} wird durch den Namen der Messstation
        ersetzt, die den Grenzwert überschritten hat.
      default: "⚠️ Luftqualität schlecht – {{ trigger.to_state.name }}"
      selector:
        text: {}

    notification_message:
      name: Nachrichtentext
      description: >
        {{ trigger.to_state.state }} wird durch den aktuellen CO2-Wert
        ersetzt, {{ trigger.to_state.name }} durch den Stationsnamen.
      default: "CO2-Wert liegt bei {{ trigger.to_state.state }} ppm - bitte lüften!"
      selector:
        text: {}

variables:
  notification_tag: "co2_alert_{{ trigger.entity_id | slugify }}"

trigger:
  - trigger: numeric_state
    entity_id: !input co2_sensors
    above: !input threshold_high
    id: "high"
  - trigger: numeric_state
    entity_id: !input co2_sensors
    below: !input threshold_low
    id: "low"

action:
  - choose:
      # Grenzwert überschritten -> Benachrichtigung senden, aber nur im Zeitfenster
      - conditions:
          - condition: trigger
            id: "high"
          - condition: time
            after: !input time_start
            before: !input time_end
        sequence:
          - repeat:
              for_each: !input notify_devices
              sequence:
                - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                  data:
                    title: !input notification_title
                    message: !input notification_message
                    data:
                      tag: "{{ notification_tag }}"
                      channel: "Luftqualität"
                      importance: high
                      priority: high

      # Wert wieder unter unterem Grenzwert -> nur die Benachrichtigung
      # dieses einen Sensors entfernen (unabhängig vom Zeitfenster)
      - conditions:
          - condition: trigger
            id: "low"
        sequence:
          - repeat:
              for_each: !input notify_devices
              sequence:
                - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                  data:
                    message: "clear_notification"
                    data:
                      tag: "{{ notification_tag }}"

mode: parallel
max_exceeded: silent
