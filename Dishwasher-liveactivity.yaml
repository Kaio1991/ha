blueprint:
  name: Geschirrspüler - iOS Live Activity
  description: >
    Erstellt eine iOS Live Activity für den Geschirrspüler und sendet eine
    Fertigmeldung, sobald der Betriebszustand auf "Fertig" wechselt.

    Die Endzeit wird nur aktualisiert, wenn sich die Fertigstellungsminute
    ändert. Sekundenänderungen von Home Connect werden ignoriert.

    Es können mehrere Notify-Entitäten ausgewählt werden. Die Live Activity
    und die Fertigmeldung werden an alle ausgewählten Geräte gesendet.

    Die Dashboard-URL ist optional. Wenn sie leer bleibt, wird /lovelace/0
    verwendet.
  domain: automation
  author: Kai
  homeassistant:
    min_version: 2026.7.0

  input:

    end_time_sensor:
      name: Endzeit-Sensor
      description: >
        Sensor mit der erwarteten Endzeit des Geschirrspülers.
        Beispiel: sensor.geschirrspuler_programm_endzeit
      selector:
        entity:
          domain: sensor

    operating_state_sensor:
      name: Betriebszustand-Sensor
      description: >
        Sensor für den Betriebszustand des Geschirrspülers.
        Bei Änderung auf "Fertig" wird die Fertigmeldung ausgelöst.
      selector:
        entity:
          domain: sensor

    notify_entities:
      name: Mobile-App-Geräte
      description: >
        Wähle eine oder mehrere Notify-Entitäten aus, an die die Live Activity
        und die Fertigmeldung gesendet werden sollen.
      selector:
        entity:
          domain: notify
          multiple: true

    dashboard_url:
      name: Dashboard-URL
      description: >
        Relative URL der Dashboard-Sicht, die beim Antippen der
        Benachrichtigung geöffnet werden soll.
        Beispiel: /dashboard-dashboard

        Leer lassen, um /lovelace/0 zu verwenden.
      default: ""
      selector:
        text:

    activity_tag:
      name: Live-Activity Tag
      description: >
        Eindeutiger Tag für die Live Activity.
      default: geschirrspueler
      selector:
        text:

    notification_icon:
      name: Benachrichtigungs-Symbol
      description: >
        Material Design Icon für die Benachrichtigung.
      default: mdi:dishwasher
      selector:
        text:

    notification_icon_color:
      name: Farbe des Benachrichtigungs-Symbols
      default: "#26C6DA"
      selector:
        color_rgb:

    completion_title:
      name: Titel der Fertigmeldung
      default: Geschirrspüler fertig
      selector:
        text:

    completion_message:
      name: Text der Fertigmeldung
      default: Der Geschirrspüler ist fertig.
      selector:
        text:

mode: parallel
max: 10
max_exceeded: silent

triggers:

  # ============================================================
  # Home Connect aktualisiert die Endzeit
  # ============================================================
  - trigger: state
    entity_id: !input end_time_sensor
    id: endzeit

  # ============================================================
  # Home Assistant wurde gestartet
  # ============================================================
  - trigger: homeassistant
    event: start
    id: startup

  # ============================================================
  # Geschirrspüler meldet "Fertig"
  # ============================================================
  - trigger: state
    entity_id: !input operating_state_sensor
    to: "Fertig"
    id: fertig

actions:

  # ============================================================
  # VARIABLEN
  # ============================================================
  - variables:
      dashboard_url_input: !input dashboard_url

      dashboard_url: >-
        {% if dashboard_url_input | trim != '' %}
          {{ dashboard_url_input | trim }}
        {% else %}
          /lovelace/0
        {% endif %}

  # ============================================================
  # FERTIGMELDUNG
  # ============================================================
  - choose:

      - conditions:
          - condition: trigger
            id: fertig

        sequence:

          # ------------------------------------------------------
          # Live Activity auf allen ausgewählten Geräten löschen
          # ------------------------------------------------------
          - repeat:
              for_each: !input notify_entities
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    message: "clear_notification"
                    data:
                      tag: !input activity_tag

          # ------------------------------------------------------
          # Fertigmeldung an alle ausgewählten Geräte senden
          # ------------------------------------------------------
          - repeat:
              for_each: !input notify_entities
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    title: !input completion_title
                    message: !input completion_message
                    data:
                      notification_icon: !input notification_icon
                      notification_icon_color: !input notification_icon_color
                      url: "{{ dashboard_url }}"
                      push:
                        sound:
                          name: default
                          critical: 0
                          volume: 1.0

  # ============================================================
  # LIVE ACTIVITY
  # ============================================================
  - choose:

      - conditions:
          - condition: template
            value_template: >
              {{ trigger.id in ['endzeit', 'startup'] }}

        sequence:

          - variables:

              sensorwert: >
                {{ states(!input end_time_sensor) }}

              endzeit: >-
                {% if sensorwert in ['unknown', 'unavailable', 'none', ''] %}
                  {{ none }}
                {% else %}
                  {{ as_datetime(sensorwert, default=none) }}
                {% endif %}

              endzeit_ts: >-
                {{ as_timestamp(endzeit, default=0) | int }}

              jetzt_ts: >-
                {{ as_timestamp(now()) | int }}

              endzeit_formatiert: >-
                {{ endzeit_ts | timestamp_custom('%H:%M') }}

              # Prüfen, ob sich die Fertigstellungsminute geändert hat.
              #
              # 14:05:31 -> 14:05:52 = kein Update
              # 14:05:52 -> 14:06:03 = Update
              minute_geaendert: >-
                {% if trigger.id == 'startup' %}
                  true
                {% elif trigger.from_state is none or trigger.to_state is none %}
                  true
                {% else %}
                  {% set alt = as_datetime(
                    trigger.from_state.state,
                    default=none
                  ) %}
                  {% set neu = as_datetime(
                    trigger.to_state.state,
                    default=none
                  ) %}

                  {% if alt is none or neu is none %}
                    true
                  {% else %}
                    {{
                      alt.strftime('%Y-%m-%d %H:%M')
                      !=
                      neu.strftime('%Y-%m-%d %H:%M')
                    }}
                  {% endif %}
                {% endif %}

          # ------------------------------------------------------
          # Nur bei Änderung der Fertigstellungsminute reagieren
          # ------------------------------------------------------
          - condition: template
            value_template: "{{ minute_geaendert | bool }}"

          # ------------------------------------------------------
          # Nur wenn eine zukünftige Endzeit vorhanden ist
          # ------------------------------------------------------
          - condition: template
            value_template: "{{ endzeit_ts > jetzt_ts }}"

          # ------------------------------------------------------
          # Live Activity an alle ausgewählten Geräte senden
          # ------------------------------------------------------
          - repeat:
              for_each: !input notify_entities
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    title: "Geschirrspüler"
                    message: "Fertig um {{ endzeit_formatiert }} Uhr"
                    data:
                      tag: !input activity_tag
                      live_update: true
                      chronometer: true
                      when: "{{ endzeit_ts - jetzt_ts }}"
                      when_relative: true
                      notification_icon: !input notification_icon
                      notification_icon_color: !input notification_icon_color
                      progress_bar_direction: decreasing
                      url: "{{ dashboard_url }}"
