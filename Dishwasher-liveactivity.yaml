blueprint:
  name: Geschirrspüler – iOS Live Activity
  description: >
    Erstellt und aktualisiert eine iOS Live Activity für einen Geschirrspüler.
    Die Endzeit wird nur aktualisiert, wenn sich die Fertigstellungsminute ändert.
    Die Fertigmeldung wird unabhängig davon ausgelöst, sobald der
    Betriebszustand auf "Fertig" wechselt.
  domain: automation
  author: Kai
  homeassistant:
    min_version: 2026.7.0

  input:

    end_time_sensor:
      name: Endzeit-Sensor
      description: >
        Sensor mit der erwarteten Endzeit des Geschirrspülers.
        Erwartet einen ISO-8601-Zeitstempel.
      selector:
        entity:
          domain: sensor

    operating_state_sensor:
      name: Betriebszustand-Sensor
      description: >
        Sensor für den Betriebszustand des Geschirrspülers.
        Bei Zustand "Fertig" wird die Fertigmeldung ausgelöst.
      selector:
        entity:
          domain: sensor

    notify_service:
      name: iPhone Notify-Dienst
      description: >
        Vollständiger Notify-Dienst des iPhones,
        z.B. notify.mobile_app_iphone_17_von_kai
      selector:
        text:

    activity_tag:
      name: Live-Activity Tag
      description: Eindeutiger Tag für die Live Activity.
      default: geschirrspueler
      selector:
        text:

    notification_icon:
      name: Benachrichtigungs-Symbol
      default: mdi:dishwasher
      selector:
        text:

    completion_title:
      name: Titel der Fertigmeldung
      default: Geschirrspüler fertig
      selector:
        text:

    completion_message:
      name: Text der Fertigmeldung
      default: Der Geschirrspüler ist fertig.
      selector:
        text:

mode: parallel
max: 10
max_exceeded: silent

triggers:

  # ------------------------------------------------------------
  # Home Connect aktualisiert die Endzeit
  # ------------------------------------------------------------
  - trigger: state
    entity_id: !input end_time_sensor
    id: endzeit

  # ------------------------------------------------------------
  # Home Assistant wurde gestartet
  # ------------------------------------------------------------
  - trigger: homeassistant
    event: start
    id: startup

  # ------------------------------------------------------------
  # Geschirrspüler meldet "Fertig"
  # ------------------------------------------------------------
  - trigger: state
    entity_id: !input operating_state_sensor
    to: "Fertig"
    id: fertig

actions:

  # ============================================================
  # FERTIGMELDUNG
  # ============================================================
  - choose:

      - conditions:
          - condition: trigger
            id: fertig

        sequence:

          # ------------------------------------------------------
          # Live Activity löschen
          # ------------------------------------------------------
          - action: "{{ notify_service }}"
            data:
              message: "clear_notification"
              data:
                tag: !input activity_tag

          # ------------------------------------------------------
          # Fertigmeldung senden
          # ------------------------------------------------------
          - action: "{{ notify_service }}"
            data:
              title: !input completion_title
              message: !input completion_message
              data:
                notification_icon: !input notification_icon
                notification_icon_color: "#26C6DA"
                url: "/lovelace/0"
                push:
                  sound:
                    name: "default"
                    critical: 0
                    volume: 1.0

  # ============================================================
  # LIVE ACTIVITY
  # ============================================================
  - choose:

      - conditions:
          - condition: template
            value_template: >
              {{ trigger.id in ['endzeit', 'startup'] }}

        sequence:

          - variables:

              sensorwert: >
                {{ states(!input end_time_sensor) }}

              endzeit: >
                {% if sensorwert in ['unknown', 'unavailable', 'none', ''] %}
                  {{ none }}
                {% else %}
                  {{ as_datetime(sensorwert, default=none) }}
                {% endif %}

              endzeit_ts: >
                {{ as_timestamp(endzeit, default=0) | int }}

              jetzt_ts: >
                {{ as_timestamp(now()) | int }}

              endzeit_formatiert: >
                {{ endzeit_ts | timestamp_custom('%H:%M') }}

              minute_geaendert: >
                {% if trigger.id == 'startup' %}
                  true
                {% elif trigger.from_state is none or trigger.to_state is none %}
                  true
                {% else %}
                  {% set alt = as_datetime(
                    trigger.from_state.state,
                    default=none
                  ) %}
                  {% set neu = as_datetime(
                    trigger.to_state.state,
                    default=none
                  ) %}

                  {% if alt is none or neu is none %}
                    true
                  {% else %}
                    {{
                      alt.strftime('%Y-%m-%d %H:%M')
                      !=
                      neu.strftime('%Y-%m-%d %H:%M')
                    }}
                  {% endif %}
                {% endif %}

          # ------------------------------------------------------
          # Nur bei Änderung der Fertigstellungsminute reagieren
          # ------------------------------------------------------
          - condition: template
            value_template: >
              {{ minute_geaendert | bool }}

          # ------------------------------------------------------
          # Nur bei einer zukünftigen Endzeit Live Activity senden
          # ------------------------------------------------------
          - condition: template
            value_template: >
              {{ endzeit_ts > jetzt_ts }}

          # ------------------------------------------------------
          # Live Activity starten / aktualisieren
          # ------------------------------------------------------
          - action: "{{ notify_service }}"
            data:
              title: "Geschirrspüler"
              message: "Fertig um {{ endzeit_formatiert }} Uhr"
              data:
                tag: !input activity_tag
                live_update: true
                chronometer: true
                when: "{{ endzeit_ts - jetzt_ts }}"
                when_relative: true
                notification_icon: !input notification_icon
                notification_icon_color: "#26C6DA"
                progress_bar_direction: decreasing
                url: "/lovelace/0"
