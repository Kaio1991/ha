blueprint:
  name: Geschirrspüler - iOS Live Activity
  description: >
    Erstellt eine iOS Live Activity für einen Geschirrspüler.
    Die Endzeit wird aus einem Sensor gelesen, der einen ISO-8601
    Zeitstempel liefert, zum Beispiel 2026-09-23T12:42:34+00:00.
    Änderungen der Endzeit durch Home Connect aktualisieren die
    bestehende Live Activity.
    Nach dem Ende wird die Live Activity beendet und eine normale
    Fertigmeldung gesendet.
    Ein zweites iPhone kann optional angegeben werden.
  domain: automation
  author: Kai
  homeassistant:
    min_version: 2026.7.0

  input:

    end_time_sensor:
      name: Endzeit-Sensor
      description: >
        Sensor mit der Endzeit des Geschirrspülers.
      selector:
        entity:
          domain: sensor

    primary_notify:
      name: Haupt-iPhone
      description: >
        Notify-Entity des ersten iPhones.
      selector:
        entity:
          domain: notify

    secondary_notify:
      name: Zweites iPhone (optional)
      description: >
        Optionales zweites Notify-Entity.
        Leer lassen, wenn kein zweites iPhone verwendet werden soll.
      default: []
      selector:
        entity:
          domain: notify
          multiple: true

    activity_tag:
      name: Live Activity Tag
      description: >
        Eindeutiger Name für die Live Activity.
      default: geschirrspueler
      selector:
        text:

    notification_icon:
      name: Symbol
      description: >
        Symbol für die Benachrichtigung.
      default: mdi:dishwasher
      selector:
        icon:

    completion_title:
      name: Titel der Fertigmeldung
      default: Geschirrspüler fertig
      selector:
        text:

    completion_message:
      name: Text der Fertigmeldung
      default: Der Geschirrspüler ist fertig.
      selector:
        text:


mode: restart
max_exceeded: silent


triggers:

  - trigger: state
    entity_id: !input end_time_sensor

  - trigger: homeassistant
    event: start


actions:

  - variables:
      sensorwert: "{{ states(!input end_time_sensor) }}"
      primary_notify: !input primary_notify
      secondary_notify: !input secondary_notify
      activity_tag: !input activity_tag
      notification_icon: !input notification_icon
      completion_title: !input completion_title
      completion_message: !input completion_message


  - variables:
      endzeit: >-
        {% if sensorwert in ['unknown', 'unavailable', 'none', ''] %}
          {{ none }}
        {% else %}
          {{ as_datetime(sensorwert, default=none) }}
        {% endif %}


  - variables:
      endzeit_ts: >-
        {% if endzeit is not none %}
          {{ as_timestamp(endzeit, default=0) | int }}
        {% else %}
          0
        {% endif %}

      jetzt_ts: "{{ as_timestamp(now()) | int }}"


  - variables:
      rest_sekunden: >-
        {{ [endzeit_ts - jetzt_ts, 0] | max }}

      endzeit_formatiert: >-
        {% if endzeit_ts > 0 %}
          {{ endzeit_ts | timestamp_custom('%H:%M') }}
        {% else %}
          unbekannt
        {% endif %}


  - choose:

      # ==========================================================
      # GESCHIRRSPÜLER LÄUFT
      # ==========================================================

      - conditions:
          - condition: template
            value_template: "{{ endzeit_ts > jetzt_ts }}"

        sequence:

          # ------------------------------------------------------
          # LIVE ACTIVITY - HAUPT-IPHON
          # ------------------------------------------------------

          - action: notify.send_message
            target:
              entity_id: "{{ primary_notify }}"
            data:
              title: "Geschirrspüler"
              message: "Fertig um {{ endzeit_formatiert }} Uhr"
              data:
                tag: "{{ activity_tag }}"
                live_update: true
                chronometer: true
                when: "{{ rest_sekunden }}"
                when_relative: true
                notification_icon: "{{ notification_icon }}"
                notification_icon_color: "#26C6DA"
                progress_bar_direction: decreasing
                url: "/lovelace/0"


          # ------------------------------------------------------
          # LIVE ACTIVITY - ZWEITES IPHONE
          # ------------------------------------------------------

          - if:
              - condition: template
                value_template: "{{ secondary_notify | length > 0 }}"
            then:

              - repeat:
                  for_each: "{{ secondary_notify }}"
                  sequence:

                    - action: notify.send_message
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        title: "Geschirrspüler"
                        message: "Fertig um {{ endzeit_formatiert }} Uhr"
                        data:
                          tag: "{{ activity_tag }}"
                          live_update: true
                          chronometer: true
                          when: "{{ rest_sekunden }}"
                          when_relative: true
                          notification_icon: "{{ notification_icon }}"
                          notification_icon_color: "#26C6DA"
                          progress_bar_direction: decreasing
                          url: "/lovelace/0"


          # ------------------------------------------------------
          # BIS ZUR ENDZEIT WARTEN
          # ------------------------------------------------------

          - delay:
              seconds: "{{ rest_sekunden }}"


          # ------------------------------------------------------
          # AKTUELLEN SENSORWERT ERNEUT AUSLESEN
          # ------------------------------------------------------

          - variables:
              aktueller_sensorwert: "{{ states(!input end_time_sensor) }}"

          - variables:
              aktuelle_endzeit: >-
                {% if aktueller_sensorwert in ['unknown', 'unavailable', 'none', ''] %}
                  {{ none }}
                {% else %}
                  {{ as_datetime(aktueller_sensorwert, default=none) }}
                {% endif %}

          - variables:
              aktuelle_endzeit_ts: >-
                {% if aktuelle_endzeit is not none %}
                  {{ as_timestamp(aktuelle_endzeit, default=0) | int }}
                {% else %}
                  0
                {% endif %}


          # ------------------------------------------------------
          # NUR BEI TATSÄCHLICHEM ENDE FORTFAHREN
          # ------------------------------------------------------

          - condition: template
            value_template: >
              {{ aktuelle_endzeit_ts > 0
                 and aktuelle_endzeit_ts <= as_timestamp(now()) }}


          # ------------------------------------------------------
          # LIVE ACTIVITY BEENDEN - HAUPT-IPHON
          # ------------------------------------------------------

          - action: notify.send_message
            target:
              entity_id: "{{ primary_notify }}"
            data:
              message: "clear_notification"
              data:
                tag: "{{ activity_tag }}"


          # ------------------------------------------------------
          # LIVE ACTIVITY BEENDEN - ZWEITES IPHONE
          # ------------------------------------------------------

          - if:
              - condition: template
                value_template: "{{ secondary_notify | length > 0 }}"
            then:

              - repeat:
                  for_each: "{{ secondary_notify }}"
                  sequence:

                    - action: notify.send_message
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        message: "clear_notification"
                        data:
                          tag: "{{ activity_tag }}"


          # ------------------------------------------------------
          # FERTIGMELDUNG - HAUPT-IPHON
          # ------------------------------------------------------

          - action: notify.send_message
            target:
              entity_id: "{{ primary_notify }}"
            data:
              title: "{{ completion_title }}"
              message: "{{ completion_message }}"
              data:
                notification_icon: "{{ notification_icon }}"
                notification_icon_color: "#26C6DA"
                url: "/lovelace/0"
                push:
                  sound:
                    name: "default"
                    critical: 0
                    volume: 1.0


          # ------------------------------------------------------
          # FERTIGMELDUNG - ZWEITES IPHONE
          # ------------------------------------------------------

          - if:
              - condition: template
                value_template: "{{ secondary_notify | length > 0 }}"
            then:

              - repeat:
                  for_each: "{{ secondary_notify }}"
                  sequence:

                    - action: notify.send_message
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        title: "{{ completion_title }}"
                        message: "{{ completion_message }}"
                        data:
                          notification_icon: "{{ notification_icon }}"
                          notification_icon_color: "#26C6DA"
                          url: "/lovelace/0"
                          push:
                            sound:
                              name: "default"
                              critical: 0
                              volume: 1.0


      # ==========================================================
      # KEINE GÜLTIGE ENDZEIT
      # ==========================================================

      - conditions:
          - condition: template
            value_template: "{{ endzeit_ts <= jetzt_ts }}"

        sequence:

          - action: notify.send_message
            target:
              entity_id: "{{ primary_notify }}"
            data:
              message: "clear_notification"
              data:
                tag: "{{ activity_tag }}"


          - if:
              - condition: template
                value_template: "{{ secondary_notify | length > 0 }}"
            then:

              - repeat:
                  for_each: "{{ secondary_notify }}"
                  sequence:

                    - action: notify.send_message
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        message: "clear_notification"
                        data:
                          tag: "{{ activity_tag }}"
