
blueprint:
  name: Geschirrspüler - iOS Live Activity
  description: >
    Zeigt die Endzeit eines Geschirrspülers als iOS Live Activity an.
    Die Endzeit wird aus einem Sensor im Format
    "22. September 2026 um 14:46" gelesen.

    Änderungen der Endzeit durch Home Connect aktualisieren die
    bestehende Live Activity.

    Nach dem Ende des Programms wird die Live Activity entfernt
    und eine normale Fertigmeldung gesendet.

    Unterstützt ein optionales zweites iPhone.
  domain: automation
  author: Kai
  homeassistant:
    min_version: 2026.7.0

  input:

    dishwasher_section:
      name: Geschirrspüler
      icon: mdi:dishwasher
      description: Einstellungen für den Geschirrspüler.
      collapsed: false
      input:

        end_time_sensor:
          name: Endzeit-Sensor
          description: >
            Sensor mit der Home-Connect-Endzeit,
            z. B. "22. September 2026 um 14:46".
          selector:
            entity:
              filter:
                - domain: sensor

    notification_section:
      name: Benachrichtigungen
      icon: mdi:cellphone-message
      description: >
        iOS-Gerät(e), auf denen die Live Activity und
        die Fertigmeldung angezeigt werden.
      collapsed: false
      input:

        primary_notify:
          name: Haupt-iPhone
          description: >
            Notify-Entity des iPhones, auf dem die Live Activity
            angezeigt werden soll.
          selector:
            entity:
              filter:
                - domain: notify

        secondary_notify:
          name: Zweites iPhone (optional)
          description: >
            Optionales weiteres Notify-Entity. Leer lassen,
            wenn kein zweites iPhone verwendet werden soll.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: notify

    live_activity_section:
      name: Live Activity
      icon: mdi:progress-clock
      description: Einstellungen für die iOS Live Activity.
      collapsed: true
      input:

        activity_tag:
          name: Live-Activity Tag
          description: >
            Eindeutiger Tag für diese Live Activity.
            Bei mehreren Geschirrspülern unterschiedliche Tags verwenden.
          default: geschirrspueler
          selector:
            text:

        notification_icon:
          name: Symbol
          description: Symbol für die Benachrichtigung.
          default: mdi:dishwasher
          selector:
            icon:

    completion_section:
      name: Fertigmeldung
      icon: mdi:check-circle
      description: Einstellungen für die normale Benachrichtigung nach Programmende.
      collapsed: true
      input:

        completion_title:
          name: Titel
          default: Geschirrspüler fertig
          selector:
            text:

        completion_message:
          name: Nachricht
          default: Der Geschirrspüler ist fertig.
          selector:
            text:


mode: restart
max_exceeded: silent

triggers:

  # ------------------------------------------------------------
  # Home Connect ändert die Endzeit
  # ------------------------------------------------------------
  - trigger: state
    entity_id: !input end_time_sensor
    id: endzeit_geaendert

  # ------------------------------------------------------------
  # Nach einem Home-Assistant-Neustart
  # ------------------------------------------------------------
  - trigger: homeassistant
    event: start
    id: homeassistant_start


actions:

  # ------------------------------------------------------------
  # Eingaben als Variablen verfügbar machen
  # ------------------------------------------------------------
  - variables:
      sensorwert: "{{ states(!input end_time_sensor) }}"

      primary_notify: !input primary_notify
      secondary_notify: !input secondary_notify

      activity_tag: !input activity_tag
      notification_icon: !input notification_icon

      completion_title: !input completion_title
      completion_message: !input completion_message

  # ------------------------------------------------------------
  # Deutsches Datum parsen
  #
  # Beispiel:
  # 22. September 2026 um 14:46
  #
  # wird zunächst zu:
  # 22. 09 2026 14:46
  # ------------------------------------------------------------
  - variables:
      datum_text: >-
        {% set ns = namespace(wert=sensorwert | lower) %}
        {% set monate = {
          'januar': '01',
          'februar': '02',
          'märz': '03',
          'maerz': '03',
          'april': '04',
          'mai': '05',
          'juni': '06',
          'juli': '07',
          'august': '08',
          'september': '09',
          'oktober': '10',
          'november': '11',
          'dezember': '12'
        } %}
        {% for monat, nummer in monate.items() %}
          {% set ns.wert = ns.wert | replace(monat, nummer) %}
        {% endfor %}
        {{ ns.wert | replace(' um ', ' ') }}

      endzeit_ts: >-
        {% if sensorwert not in ['unknown', 'unavailable', 'none', ''] %}
          {{ as_timestamp(
               strptime(
                 datum_text,
                 '%d. %m %Y %H:%M'
               ),
               default=0
             ) | int(0) }}
        {% else %}
          0
        {% endif %}

      jetzt_ts: "{{ as_timestamp(now()) | int }}"

  # ------------------------------------------------------------
  # Restzeit berechnen
  # ------------------------------------------------------------
  - variables:
      rest_sekunden: >-
        {{ [endzeit_ts - jetzt_ts, 0] | max }}

      endzeit_formatiert: >-
        {% if endzeit_ts > 0 %}
          {{ endzeit_ts | timestamp_custom('%H:%M') }}
        {% else %}
          unbekannt
        {% endif %}


  # ============================================================
  # GESCHIRRSPÜLER LÄUFT
  # ============================================================
  - choose:

      - conditions:
          - condition: template
            value_template: >
              {{ endzeit_ts > jetzt_ts }}

        sequence:

          # ------------------------------------------------------
          # Live Activity auf Haupt-iPhone starten/aktualisieren
          # ------------------------------------------------------
          - action: notify.send_message
            target:
              entity_id: "{{ primary_notify }}"
            data:
              title: "Geschirrspüler"
              message: "Fertig um {{ endzeit_formatiert }} Uhr"
              data:
                tag: "{{ activity_tag }}"
                live_update: true

                chronometer: true
                when: "{{ rest_sekunden }}"
                when_relative: true

                notification_icon: "{{ notification_icon }}"
                notification_icon_color: "#26C6DA"

                progress_bar_direction: decreasing

                url: "/lovelace/0"


          # ------------------------------------------------------
          # Live Activity auf optionalem zweitem iPhone
          # ------------------------------------------------------
          - choose:
              - conditions:
                  - condition: template
                    value_template: >
                      {{ secondary_notify | length > 0 }}

                sequence:

                  - repeat:
                      for_each: "{{ secondary_notify }}"
                      sequence:

                        - action: notify.send_message
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            title: "Geschirrspüler"
                            message: "Fertig um {{ endzeit_formatiert }} Uhr"
                            data:
                              tag: "{{ activity_tag }}"
                              live_update: true

                              chronometer: true
                              when: "{{ rest_sekunden }}"
                              when_relative: true

                              notification_icon: "{{ notification_icon }}"
                              notification_icon_color: "#26C6DA"

                              progress_bar_direction: decreasing

                              url: "/lovelace/0"


          # ------------------------------------------------------
          # Warten bis zur aktuellen Endzeit
          #
          # Wird die Endzeit durch Home Connect geändert,
          # startet die Automation wegen mode: restart neu.
          # ------------------------------------------------------
          - delay:
              seconds: "{{ rest_sekunden }}"


          # ------------------------------------------------------
          # Aktuelle Endzeit nach dem Warten erneut auslesen.
          #
          # Dadurch wird verhindert, dass eine alte Endzeit
          # eine Fertigmeldung erzeugt, wenn Home Connect das
          # Programm zwischenzeitlich verlängert hat.
          # ------------------------------------------------------
          - variables:
              aktueller_sensorwert: >
                {{ states(!input end_time_sensor) }}

          - variables:
              aktuelles_datum_text: >-
                {% set ns = namespace(wert=aktueller_sensorwert | lower) %}
                {% set monate = {
                  'januar': '01',
                  'februar': '02',
                  'märz': '03',
                  'maerz': '03',
                  'april': '04',
                  'mai': '05',
                  'juni': '06',
                  'juli': '07',
                  'august': '08',
                  'september': '09',
                  'oktober': '10',
                  'november': '11',
                  'dezember': '12'
                } %}
                {% for monat, nummer in monate.items() %}
                  {% set ns.wert = ns.wert | replace(monat, nummer) %}
                {% endfor %}
                {{ ns.wert | replace(' um ', ' ') }}

              aktuelle_endzeit_ts: >-
                {% if aktueller_sensorwert not in ['unknown', 'unavailable', 'none', ''] %}
                  {{ as_timestamp(
                       strptime(
                         aktuelles_datum_text,
                         '%d. %m %Y %H:%M'
                       ),
                       default=0
                     ) | int(0) }}
                {% else %}
                  0
                {% endif %}


          # ------------------------------------------------------
          # Nur wenn die aktuelle Endzeit tatsächlich erreicht
          # wurde, Fertigmeldung senden.
          # ------------------------------------------------------
          - condition: template
            value_template: >
              {{ aktuelle_endzeit_ts > 0 and
                 aktuelle_endzeit_ts <= as_timestamp(now()) }}


          # ------------------------------------------------------
          # Live Activity Haupt-iPhone entfernen
          # ------------------------------------------------------
          - action: notify.send_message
            target:
              entity_id: "{{ primary_notify }}"
            data:
              message: "clear_notification"
              data:
                tag: "{{ activity_tag }}"


          # ------------------------------------------------------
          # Live Activity zweites iPhone entfernen
          # ------------------------------------------------------
          - choose:
              - conditions:
                  - condition: template
                    value_template: >
                      {{ secondary_notify | length > 0 }}

                sequence:

                  - repeat:
                      for_each: "{{ secondary_notify }}"
                      sequence:

                        - action: notify.send_message
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            message: "clear_notification"
                            data:
                              tag: "{{ activity_tag }}"


          # ------------------------------------------------------
          # FERTIGMELDUNG Haupt-iPhone
          # ------------------------------------------------------
          - action: notify.send_message
            target:
              entity_id: "{{ primary_notify }}"
            data:
              title: "{{ completion_title }}"
              message: "{{ completion_message }}"
              data:
                notification_icon: "{{ notification_icon }}"
                notification_icon_color: "#26C6DA"
                url: "/lovelace/0"
                push:
                  sound:
                    name: "default"
                    critical: 0
                    volume: 1.0


          # ------------------------------------------------------
          # FERTIGMELDUNG optionales zweites iPhone
          # ------------------------------------------------------
          - choose:
              - conditions:
                  - condition: template
                    value_template: >
                      {{ secondary_notify | length > 0 }}

                sequence:

                  - repeat:
                      for_each: "{{ secondary_notify }}"
                      sequence:

                        - action: notify.send_message
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            title: "{{ completion_title }}"
                            message: "{{ completion_message }}"
                            data:
                              notification_icon: "{{ notification_icon }}"
                              notification_icon_color: "#26C6DA"
                              url: "/lovelace/0"
                              push:
                                sound:
                                  name: "default"
                                  critical: 0
                                  volume: 1.0


      # ============================================================
      # KEINE GÜLTIGE / ZUKÜNFTIGE ENDZEIT
      # ============================================================
      - conditions:
          - condition: template
            value_template: >
              {{ endzeit_ts <= jetzt_ts }}

        sequence:

          # Vorhandene Live Activity entfernen
          - action: notify.send_message
            target:
              entity_id: "{{ primary_notify }}"
            data:
              message: "clear_notification"
              data:
                tag: "{{ activity_tag }}"

          # Optionales zweites iPhone
          - choose:
              - conditions:
                  - condition: template
                    value_template: >
                      {{ secondary_notify | length > 0 }}

                sequence:

                  - repeat:
                      for_each: "{{ secondary_notify }}"
                      sequence:

                        - action: notify.send_message
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            message: "clear_notification"
                            data:
                              tag: "{{ activity_tag }}"
